[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardlayer"
version = "0.1.0"
description = "AI security firewall proxy — scans prompts and responses for threats before they reach your LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "httpx==0.27.0",
    "anthropic==0.28.0",
    "jinja2==3.1.4",
    "rich==13.7.1",
    "typer==0.12.3",
    "pydantic==2.7.1",
]

[project.scripts]
guardlayer = "guardlayer.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardlayer*"]
